<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Agency Armory</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">ARMORY <span>// V2.0</span></a>
        <div class="nav-links">
            <a href="index.html#systems">Systems</a>
            <a href="blog.html">Intel</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <section class="hero" style="min-height: auto; padding-top: 10rem; padding-bottom: 4rem;">
        <div class="tag">// COMM_SECURE</div>
        <h1>TRANSMIT<br><span class="text-accent">REQUEST.</span></h1>
        <p class="lead">Need a bespoke setup or have questions about the armory? Drop your details below.</p>
    </section>

    <section style="padding-top: 0;">
        <div class="card" style="max-width: 700px; margin: 0 auto;">
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Operator Name</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="agency">Agency Name</label>
                    <input type="text" id="agency" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="email">Comms Channel (Email)</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="message">Transmission Payload</label>
                    <textarea id="message" class="form-control" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">SEND SECURE MESSAGE ></button>
            </form>
        </div>
    </section>

    <footer>
        <p>© 2026 // AGENCY_ARMORY_NOMINAL. All rights reserved.</p>
    </footer>
</body>
</html>
